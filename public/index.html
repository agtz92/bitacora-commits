<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora de commits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#17202b; --muted:#5d6977; --line:#dde2e8;
  --accent:#2b5fd9; --h1:#e3ebfb; --h2:#b9cdf5; --h3:#7ea3ec; --h4:#3f73dd; --h5:#1d47a8; --hfg:#ffffff;
  --chip-s:62%; --chip-l:90%; --chip-fg:#1d2733; --ok:#1f7a4d; --err:#b3261e;
  --display:"Schibsted Grotesk",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10151c; --surface:#171e27; --fg:#e4e9ef; --muted:#93a0ae; --line:#2a3440;
  --accent:#7ea3ec; --h1:#1c2b44; --h2:#244173; --h3:#2f5bb0; --h4:#4c7ee3; --h5:#8fb0f2; --hfg:#0c1118;
  --chip-s:35%; --chip-l:26%; --chip-fg:#e4e9ef; --ok:#6fd19c; --err:#f2a39c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav a{padding:8px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--fg);border-color:var(--accent)}
header{align-items:center}
.syncbox{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0;position:relative}
.syncbox .row{display:flex;gap:8px}
.syncline{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);max-width:min(560px,100%)}
.syncline .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.syncline .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.syncline .dot.run{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.syncline .dot.err{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:.82rem;white-space:nowrap}
.linkbtn:hover,.linkbtn:focus-visible{text-decoration:underline}
.syncpanel{position:absolute;top:100%;right:0;margin-top:6px;z-index:30;width:min(460px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,40,.18);padding:14px;font-size:.85rem;display:flex;flex-direction:column;gap:10px}
.syncpanel h4{margin:0;font-family:var(--display);font-size:.95rem}
.syncpanel ul{margin:0;padding-left:18px;color:var(--muted);columns:2;column-gap:20px}
.syncpanel ul.err{columns:1;color:var(--err)}
.syncpanel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.syncpanel dt{color:var(--muted)} .syncpanel dd{margin:0;font-family:var(--mono);font-size:.8rem}
.pop{position:absolute;z-index:40;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,40,.2);padding:14px;display:flex;flex-direction:column;gap:12px}
.pop .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pop .ph b{font-family:var(--display);font-size:1rem;overflow-wrap:anywhere}
.pop .ph a{font-size:.75rem}
.pop .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.pop .opts{display:flex;flex-wrap:wrap;gap:6px}
.pop .opts button{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.pop .opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--hfg)}
.pop .opts button.tagx{font-family:var(--mono);font-size:.75rem}
.pop .add{display:flex;gap:6px;margin-top:8px}
.pop .add input{flex:1;font-size:.85rem;padding:5px 8px}
.pop .projrow{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-top:8px;font-size:.8rem}
.pop .projrow label{color:var(--muted);white-space:nowrap}
.pop .projrow input{font-size:.85rem;padding:5px 8px;min-width:0}
.chip .proj{font-weight:400;opacity:.85}
tr.grp td{background:var(--bg);font-family:var(--display);font-weight:700;font-size:.9rem;padding:10px 10px 6px;border-top:1px solid var(--line)}
tr.grp td.name{background:var(--bg)}
tr.grp td .n{font-family:var(--mono);font-weight:400;font-size:.75rem;color:var(--muted);margin-left:8px}
.sproj{border-top:2px solid var(--accent);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sproj h3{font-family:var(--display);font-size:1.05rem;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.sproj h3 .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:400}
.sproj .repos{font-size:.82rem;color:var(--muted)}
.sproj .sline .shas a{white-space:nowrap}
.sproj .sline .shas .rp{font-size:.72rem;color:var(--muted)}
.pop .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.pop .msg{font-size:.78rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:24px;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.stats b{display:block;font-size:1.3rem;color:var(--fg);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input[type=search],input[type=text],input[type=month],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.legend{display:flex;gap:4px;align-items:center;font-size:.8rem;color:var(--muted);margin-left:auto}
.legend i{width:16px;height:16px;border-radius:3px;display:inline-block}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:0}
thead th{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted);padding:8px 2px 6px;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
thead tr.yr th{font-size:.75rem;color:var(--fg);border-bottom:none;padding-bottom:0}
th.name,td.name{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;border-right:1px solid var(--line)}
td.name{padding:4px 12px 4px 10px;white-space:nowrap;font-size:.88rem;min-width:220px}
td.name button.rn{all:unset;cursor:pointer;color:var(--fg);font-weight:600}
td.name button.rn:hover,td.name button.rn:focus-visible{color:var(--accent);text-decoration:underline}
td.name small{display:block;color:var(--muted);font-family:var(--mono);font-size:.68rem}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-flex;align-items:center;font-size:.7rem;line-height:1;padding:3px 7px;border-radius:999px;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:var(--chip-fg);font-weight:600}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400;font-family:var(--mono)}
.chip.none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:400}
td.c{padding:2px}
td.c span{display:flex;align-items:center;justify-content:center;width:38px;height:30px;border-radius:4px;font-family:var(--mono);font-size:.72rem}
td.c span.pre{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 5px)}
td.tot{font-family:var(--mono);font-size:.8rem;padding:0 12px;text-align:right;color:var(--muted)}
tr.sel td,tr.sel td.name{background:var(--h1)}
tfoot td{border-top:1px solid var(--line);font-family:var(--mono);font-size:.72rem;text-align:center;padding:6px 0;color:var(--muted)}
.yearsep{border-left:2px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.sform label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.month{border-top:2px solid var(--accent);padding-top:6px;min-width:0}
.month h3{font-family:var(--display);font-size:.95rem;margin:0 0 6px;display:flex;justify-content:space-between}
.month h3 span{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-weight:400}
.day{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:.85rem;padding:3px 0;border-bottom:1px dashed var(--line)}
.day .dt{font-family:var(--mono);font-size:.78rem}
.day ul{margin:0;padding:0;list-style:none;color:var(--muted);min-width:0}
.day li{overflow-wrap:anywhere}
code,.sha{font-family:var(--mono);font-size:.74rem}
a.sha{color:var(--accent);text-decoration:none} a.sha:hover{text-decoration:underline}
.note{color:var(--muted);font-size:.85rem}
button.btn,a.btn{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--hfg);font-weight:600}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sform{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end}
.sactions{display:flex;flex-wrap:wrap;gap:8px}
.srepo{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.srepo h3{font-family:var(--display);font-size:1rem;margin:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srepo h3 .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:400}
.sline{display:grid;grid-template-columns:200px 1fr;gap:10px;font-size:.88rem}
.sline .lbl b{font-family:var(--mono);font-weight:600}
.shas{display:flex;flex-wrap:wrap;gap:4px 10px}
.bymonth{display:flex;flex-wrap:wrap;gap:6px}
.bymonth span{font-family:var(--mono);font-size:.75rem;padding:3px 8px;border:1px solid var(--line);border-radius:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
footer{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-end;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
[hidden]{display:none!important}
@media (max-width:640px){.legend{margin-left:0}.sline{grid-template-columns:1fr}.syncbox{align-items:flex-start}.syncpanel{left:0;right:auto}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginform">
    <h1 style="font-size:1.4rem">Bitácora de commits</h1>
    <label for="pw" class="note">Contraseña</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus>
    <button class="btn primary" type="submit">Entrar</button>
    <span class="msg err" id="loginmsg"></span>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>Bitácora de commits</h1>
      <p class="sub" id="subtitle">Commits por mes en cada repositorio.</p>
    </div>
    <div class="syncbox">
      <div class="row">
        <button class="btn primary" id="sync">Buscar repos y commits nuevos</button>
        <button class="btn" id="syncforce" title="Vuelve a revisar todos los repos, aunque no tengan pushes nuevos">Revisar todo</button>
      </div>
      <div class="syncline"><span class="dot" id="syncdot"></span><span class="txt" id="syncst">Cargando…</span><button class="linkbtn" id="syncmore" aria-expanded="false" aria-controls="syncpanel">Detalle</button></div>
      <div class="syncpanel" id="syncpanel" hidden></div>
    </div>
  </header>
  <nav><a href="#matriz" id="tab-matriz">Matriz</a><a href="#resumen" id="tab-resumen">Resumen</a></nav>

  <section id="v-matriz" class="wrap" style="gap:20px">
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input type="search" id="q" placeholder="Filtrar repositorio…" aria-label="Filtrar repositorio">
      <select id="fclient" aria-label="Filtrar por cliente"></select>
      <select id="fproject" aria-label="Filtrar por proyecto" hidden></select>
      <select id="ftag" aria-label="Filtrar por etiqueta"></select>
      <select id="sort" aria-label="Ordenar">
        <option value="created">Ordenar por fecha de creación</option>
        <option value="project">Agrupar por proyecto</option>
        <option value="client">Agrupar por cliente</option>
        <option value="total">Ordenar por número de commits</option>
        <option value="recent">Ordenar por último commit</option>
        <option value="name">Ordenar por nombre</option>
      </select>
      <label class="chk"><input type="checkbox" id="bots"> Incluir commits de bots</label>
      <div class="legend" id="legend"></div>
    </div>
    <div class="tablebox"><table id="t"></table></div>
    <section id="detail" class="panel"></section>
  </section>

  <section id="v-resumen" class="wrap" style="gap:20px" hidden>
    <div class="panel">
      <h2>Resumen por proyecto, repositorio y mes</h2>
      <form class="sform" id="sform">
        <label>Desde<input type="month" id="s-from"></label>
        <label>Hasta<input type="month" id="s-to"></label>
        <label>Cliente<select id="s-client"></select></label>
        <label id="s-project-l" hidden>Proyecto<select id="s-project"></select></label>
        <label>Etiqueta<select id="s-tag"></select></label>
        <label>Repositorio<select id="s-repo"></select></label>
        <label class="chk" style="text-transform:none;letter-spacing:0;font-size:.9rem;flex-direction:row"><input type="checkbox" id="s-bots"> Incluir bots</label>
      </form>
      <div class="sactions">
        <button class="btn" id="s-copy">Copiar Markdown</button>
        <a class="btn" id="s-md" href="#">Descargar Markdown</a>
        <a class="btn" id="s-csv" href="#">Descargar CSV</a>
        <span class="msg" id="s-msg"></span>
      </div>
    </div>
    <div class="panel" id="sout"></div>
  </section>
  <footer>
    <label class="linkbtn" for="importfile">Importar clientes y etiquetas (JSON)</label>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
    <a class="linkbtn" href="/api/meta/export" download="clientes-etiquetas.json">Exportar</a>
    <button class="linkbtn" id="logout">Salir</button>
    <span class="msg" id="footmsg"></span>
  </footer>
</div>
<datalist id="clients"></datalist><datalist id="projopts"></datalist><datalist id="tagopts"></datalist>
<script>
const MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const BASE_CLIENTS=['Hulempak','HEQ','PHASA','DRR','Personal'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtM=k=>{const[y,m]=k.split('-');return MN[+m-1]+' '+y};
const fmtD=d=>{if(!d)return '';const[y,m,dd]=d.split('-');return `${+dd} ${MN[+m-1]} ${y}`};
const hue=s=>{let h=0;for(const ch of s.toLowerCase())h=(h*31+ch.charCodeAt(0))%360;return h};
const chip=(c,p)=>`<span class="chip" style="--h:${hue(c)}">${esc(c)}${p?`<span class="proj"> · ${esc(p)}</span>`:''}</span>`;
const parseList=(s,lower)=>[...new Set(s.split(',').map(t=>lower?t.trim().toLowerCase():t.trim()).filter(Boolean))];
class AuthError extends Error{}
const api=async(url,opt)=>{const r=await fetch(url,{credentials:'same-origin',...opt});
  if(r.status===401){showLogin();throw new AuthError('Inicia sesión')}
  if(!r.ok){let m;try{m=(await r.json()).detail}catch(e){}throw new Error(m||('Error '+r.status))}return r.json()};
function showLogin(){$('#login').hidden=false;$('#app').hidden=true;$('#pw').focus()}

let state={q:'',sort:'created',bots:false,sel:null,fclient:'',ftag:'',fproject:''};
try{Object.assign(state,JSON.parse(localStorage.getItem('bitacora')||'{}'));state.q='';}catch(e){}
const save=()=>{try{localStorage.setItem('bitacora',JSON.stringify({sort:state.sort,bots:state.bots,fclient:state.fclient,ftag:state.ftag,fproject:state.fproject,sel:state.sel}))}catch(e){}};
let M={months:[],repos:[]};

function allClients(){return [...new Set([...BASE_CLIENTS,...M.repos.flatMap(r=>r.clients)])]}
function allTags(){return [...new Set(M.repos.flatMap(r=>r.tags))].sort()}
function projOf(r,c){if(!c)return '';const k=Object.keys(r.projects||{}).find(x=>x.toLowerCase()===c.toLowerCase());return k?r.projects[k]:''}
function projectsOf(c){return [...new Set(M.repos.map(r=>projOf(r,c)).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function level(n){return n===0?0:n<=2?1:n<=6?2:n<=15?3:n<=40?4:5}
function fillSelect(el,allLabel,items,val){el.innerHTML=`<option value="">${allLabel}</option>${items.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}<option value="__none">Sin asignar</option>`;el.value=[...el.options].some(o=>o.value===val)?val:''}

async function loadMatrix(){M=await api(`/api/matrix?bots=${state.bots}`);$('#subtitle').textContent=`Commits por mes desde ${fmtD(M.since)}. Hora de ${M.timezone}.`;renderTable();renderDetail()}

function renderTable(){
  $('#q').value=state.q;$('#sort').value=state.sort;$('#bots').checked=state.bots;
  fillSelect($('#fclient'),'Todos los clientes',allClients(),state.fclient);state.fclient=$('#fclient').value;
  fillSelect($('#ftag'),'Todas las etiquetas',allTags(),state.ftag);state.ftag=$('#ftag').value;
  const fc=state.fclient&&state.fclient!=='__none'?state.fclient:'';
  $('#fproject').hidden=!fc;
  if(fc){fillSelect($('#fproject'),'Todos los proyectos',projectsOf(fc),state.fproject);state.fproject=$('#fproject').value}else state.fproject='';
  $('#clients').innerHTML=allClients().map(c=>`<option value="${esc(c)}">`).join('');$('#tagopts').innerHTML=allTags().map(c=>`<option value="${esc(c)}">`).join('');
  let rows=M.repos.filter(r=>{
    if(!r.name.toLowerCase().includes(state.q.toLowerCase()))return false;
    if(state.fclient==='__none'&&r.clients.length)return false;
    if(state.fclient&&state.fclient!=='__none'&&!r.clients.includes(state.fclient))return false;
    if(state.ftag==='__none'&&r.tags.length)return false;
    if(state.ftag&&state.ftag!=='__none'&&!r.tags.includes(state.ftag))return false;
    if(fc&&state.fproject==='__none'&&projOf(r,fc))return false;
    if(fc&&state.fproject&&state.fproject!=='__none'&&projOf(r,fc)!==state.fproject)return false;
    return true});
  const s=state.sort;
  // Agrupar por proyecto: del cliente filtrado o, si no hay, del primer cliente de cada repo.
  const gkey=r=>{const c=fc||r.clients[0]||'';const p=projOf(r,c);return c?(p?`${fc?'':c+' · '}${p}`:`${fc?'':c+' · '}Sin proyecto asignado`):'Sin cliente'};
  const gTot={};if(s==='project')for(const r of rows){const k=gkey(r);gTot[k]=(gTot[k]||0)+r.total}
  rows.sort((a,b)=>s==='project'?((gkey(a).includes('Sin ')-gkey(b).includes('Sin '))||gTot[gkey(b)]-gTot[gkey(a)]||gkey(a).localeCompare(gkey(b))||b.total-a.total)
    :s==='total'?b.total-a.total:s==='recent'?b.last.localeCompare(a.last):s==='name'?a.name.localeCompare(b.name)
    :s==='client'?((a.clients[0]||'~').localeCompare(b.clients[0]||'~')||a.created.localeCompare(b.created))
    :a.created.localeCompare(b.created)||a.name.localeCompare(b.name));
  const months=M.months;const years={};months.forEach(k=>{const y=k.slice(0,4);years[y]=(years[y]||0)+1});
  if(!M.repos.length){$('#t').innerHTML='<tbody><tr><td class="empty">Aún no hay datos. Pulsa “Buscar repos y commits nuevos”.</td></tr></tbody>';$('#stats').innerHTML='';return}
  let h='<thead><tr class="yr"><th class="name"></th>';
  for(const y in years)h+=`<th colspan="${years[y]}" class="yearsep">${y}</th>`;
  h+='<th></th></tr><tr><th class="name" style="padding-left:10px;text-align:left">Repositorio · cliente · etiquetas</th>';
  months.forEach(k=>h+=`<th class="${k.endsWith('-01')?'yearsep':''}">${MN[+k.slice(5)-1]}</th>`);
  h+='<th style="padding:0 12px">Total</th></tr></thead><tbody>';
  const colTot=Object.fromEntries(months.map(k=>[k,0]));
  let curG=null;
  for(const r of rows){
    if(s==='project'&&gkey(r)!==curG){curG=gkey(r);const n=rows.filter(x=>gkey(x)===curG);
      h+=`<tr class="grp"><td class="name">${esc(curG)}<span class="n">${n.length} repo${n.length===1?'':'s'} · ${gTot[curG].toLocaleString('es-MX')} commits</span></td><td colspan="${months.length+1}"></td></tr>`}
    const ck=r.created.slice(0,7);
    const chips=(r.clients.length?r.clients.map(c=>chip(c,projOf(r,c))).join(''):'<span class="chip none">sin cliente</span>')+r.tags.map(t=>`<span class="chip tag">${esc(t)}</span>`).join('');
    h+=`<tr class="${state.sel===r.id?'sel':''}"><td class="name"><button class="rn" data-r="${r.id}" aria-haspopup="dialog" aria-expanded="${popRepo===r.id}">${esc(r.name)}</button><small>${esc(r.owner)} · creado ${fmtD(r.created)}${r.error?' · ⚠ error al sincronizar':''}</small><div class="tags">${chips}</div></td>`;
    months.forEach(k=>{const n=r.months[k]||0;colTot[k]+=n;const lv=level(n);const pre=k<ck&&!n;
      const st=lv?`background:var(--h${lv});color:${lv>=4?'var(--hfg)':'var(--fg)'}`:'';
      h+=`<td class="c ${k.endsWith('-01')?'yearsep':''}"><span class="${pre?'pre':''}" style="${st}" title="${esc(r.name)} · ${fmtM(k)}: ${n} commit${n===1?'':'s'}">${n||''}</span></td>`});
    h+=`<td class="tot">${r.total}</td></tr>`;
  }
  h+='</tbody><tfoot><tr><td class="name" style="padding-left:10px;text-align:left">Total del mes</td>';
  months.forEach(k=>h+=`<td class="${k.endsWith('-01')?'yearsep':''}">${colTot[k]||''}</td>`);
  h+=`<td class="tot">${rows.reduce((a,r)=>a+r.total,0)}</td></tr></tfoot>`;
  $('#t').innerHTML=h;
  const tot=rows.reduce((a,r)=>a+r.total,0);
  $('#stats').innerHTML=`<div><b>${rows.length}</b>repositorios</div><div><b>${tot.toLocaleString('es-MX')}</b>commits</div><div><b>${months.filter(k=>colTot[k]).length} de ${months.length}</b>meses con actividad</div><div><b>${rows.filter(r=>!r.clients.length).length}</b>sin cliente</div>${fc?`<div><b>${rows.filter(r=>!projOf(r,fc)).length}</b>sin proyecto para ${esc(fc)}</div>`:''}<div><b>${fmtD(M.last_commit)}</b>último commit</div>`;
}

let detailCache={};
async function renderDetail(){
  const el=$('#detail');const r=M.repos.find(x=>x.id===state.sel);
  if(!r){el.innerHTML='<h2>Detalle por día</h2><p class="note">Toca el nombre de un repositorio para asignarle clientes y etiquetas. Desde ese menú, “Ver commits por día” muestra aquí la fecha y SHA de cada commit.</p>';return}
  const key=r.id+':'+state.bots+':'+r.total;
  if(!detailCache[key])detailCache[key]=(await api(`/api/repos/${r.id}/commits?bots=${state.bots}`)).commits;
  if(state.sel!==r.id)return;
  const cs=detailCache[key];
  const bym={};for(const c of cs){(bym[c.month]??={})[c.local_date]??=[];bym[c.month][c.local_date].push(c)}
  const keys=Object.keys(bym).sort();
  let h=`<div class="dhead"><div><h2>${esc(r.name)}</h2><p class="sub"><a class="sha" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name)}</a> · creado ${fmtD(r.created)} · ${cs.length} commits en ${keys.length} meses y ${new Set(cs.map(c=>c.local_date)).size} días</p></div><button class="btn" id="close">Cerrar detalle</button></div>
<div class="months">`;
  for(const k of keys){const ds=Object.keys(bym[k]).sort();const n=ds.reduce((a,d)=>a+bym[k][d].length,0);
    h+=`<div class="month"><h3>${fmtM(k)}<span>${n} commits · ${ds.length} días</span></h3>`;
    for(const d of ds)h+=`<div class="day"><div class="dt">${fmtD(d).replace(/ \d{4}$/,'')}</div><ul>${bym[k][d].map(c=>`<li><a class="sha" href="${esc(r.url)}/commit/${c.sha}" target="_blank" rel="noopener">${c.sha.slice(0,7)}</a> <code>${c.local_time}</code> ${esc(c.message)}${c.is_bot?' <em>(bot)</em>':''}</li>`).join('')}</ul></div>`;
    h+='</div>'}
  el.innerHTML=h+'</div>';
  $('#close').onclick=()=>{state.sel=null;save();renderTable();renderDetail()};
}

// ---- menú de cliente y etiquetas ----
let popRepo=null;
const pop=document.createElement('div');pop.className='pop';pop.hidden=true;pop.setAttribute('role','dialog');document.body.appendChild(pop);
function closePop(){pop.hidden=true;const prev=popRepo;popRepo=null;if(prev){const b=document.querySelector(`button[data-r="${prev}"]`);b?.setAttribute('aria-expanded','false');b?.focus({preventScroll:true})}}
function placePop(anchor){const a=anchor.getBoundingClientRect();const w=pop.offsetWidth;let left=a.left+window.scrollX;
  left=Math.min(left,window.scrollX+document.documentElement.clientWidth-w-16);pop.style.left=Math.max(16,left)+'px';pop.style.top=(a.bottom+window.scrollY+6)+'px'}
function openPop(id,anchor){
  const r=M.repos.find(x=>x.id===id);if(!r)return;popRepo=id;anchor.setAttribute('aria-expanded','true');
  const clients=[...new Set([...allClients(),...r.clients])];
  pop.innerHTML=`<div class="ph"><b>${esc(r.name)}</b><a class="sha" href="${esc(r.url)}" target="_blank" rel="noopener">GitHub ↗</a></div>
  <div><div class="lbl">Clientes</div><div class="opts" id="p-clients">${clients.map(c=>`<button type="button" data-c="${esc(c)}" aria-pressed="${r.clients.includes(c)}">${r.clients.includes(c)?'✓ ':''}${esc(c)}</button>`).join('')}</div>
    <form class="add" id="p-addc"><input type="text" id="p-newc" placeholder="Otro cliente…" list="clients" aria-label="Agregar otro cliente"><button class="btn" type="submit">Agregar</button></form>
    ${r.clients.length?`<div class="lbl" style="margin-top:12px">Proyecto para cada cliente</div><div class="projrow">${r.clients.map((c,i)=>`<label for="p-proj-${i}">${esc(c)}</label><input type="text" id="p-proj-${i}" data-pc="${esc(c)}" value="${esc(projOf(r,c))}" placeholder="Nombre del proyecto…" list="projopts" aria-label="Proyecto para ${esc(c)}">`).join('')}</div>`:''}</div>
  <div><div class="lbl">Etiquetas</div><div class="opts" id="p-tags">${r.tags.length?r.tags.map(t=>`<button type="button" class="tagx" data-t="${esc(t)}" aria-pressed="true" title="Quitar etiqueta">${esc(t)} ×</button>`).join(''):'<span class="note">Sin etiquetas</span>'}</div>
    <form class="add" id="p-addt"><input type="text" id="p-newt" placeholder="backlinks, seo…" list="tagopts" aria-label="Agregar etiquetas"><button class="btn" type="submit">Agregar</button></form>
    <div class="opts" style="margin-top:6px">${allTags().filter(t=>!r.tags.includes(t)).map(t=>`<button type="button" class="tagx" data-addt="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div></div>
  <div class="foot"><button class="linkbtn" id="p-commits">Ver commits por día</button><span class="msg" id="p-msg"></span></div>`;
  pop.hidden=false;placePop(anchor);
  pop.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;saveMeta(r,{clients:r.clients.includes(c)?r.clients.filter(x=>x!==c):[...r.clients,c]})});
  pop.querySelectorAll('[data-pc]').forEach(inp=>{
    inp.onfocus=()=>{$('#projopts').innerHTML=projectsOf(inp.dataset.pc).map(p=>`<option value="${esc(p)}">`).join('')};
    const commit=()=>{const v=inp.value.trim();if(v===projOf(r,inp.dataset.pc))return;saveMeta(r,{projects:{...r.projects,[inp.dataset.pc]:v}},inp.id)};
    inp.onchange=commit;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit()}}});
  pop.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>saveMeta(r,{tags:r.tags.filter(x=>x!==b.dataset.t)}));
  pop.querySelectorAll('[data-addt]').forEach(b=>b.onclick=()=>saveMeta(r,{tags:[...r.tags,b.dataset.addt]}));
  $('#p-addc').onsubmit=e=>{e.preventDefault();const v=parseList($('#p-newc').value);if(v.length)saveMeta(r,{clients:[...r.clients,...v]})};
  $('#p-addt').onsubmit=e=>{e.preventDefault();const v=parseList($('#p-newt').value,true);if(v.length)saveMeta(r,{tags:[...r.tags,...v]})};
  $('#p-commits').onclick=()=>{state.sel=r.id;save();closePop();renderTable();renderDetail();$('#detail').scrollIntoView({behavior:'smooth'})};
}
async function saveMeta(r,patch,focusId){
  const body={clients:patch.clients??r.clients,tags:patch.tags??r.tags,projects:patch.projects??r.projects??{}};
  const msg=$('#p-msg');if(msg)msg.textContent='Guardando…';
  try{const res=await api(`/api/repos/${r.id}/meta`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    r.clients=res.clients;r.tags=res.tags;r.projects=res.projects||{};renderTable();fillSummaryFilters();
    const anchor=document.querySelector(`button[data-r="${r.id}"]`);
    if(anchor&&popRepo===r.id){openPop(r.id,anchor);$('#p-msg').textContent='Guardado';$('#p-msg').className='msg ok';if(focusId)$('#'+focusId)?.focus()}
    if(state.sel===r.id)renderDetail()}
  catch(e){if(msg){msg.textContent='No se pudo guardar';msg.className='msg err'}}
}
document.addEventListener('click',e=>{
  if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('button[data-r]'))closePop();
  if(!$('#syncpanel').hidden&&!e.target.closest('.syncbox'))toggleSyncPanel(false);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!pop.hidden)closePop();toggleSyncPanel(false)}});
window.addEventListener('resize',()=>{if(!pop.hidden){const a=document.querySelector(`button[data-r="${popRepo}"]`);a?placePop(a):closePop()}});

// ---- sincronización (en pasos de ~40 s) ----
let lastSync=null,syncing=false;
const fmtWhen=s=>new Date(s).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});
function renderSync(st){
  const dot=$('#syncdot'),txt=$('#syncst');lastSync=st;const l=st.last;
  if(syncing||st.running){dot.className='dot run';txt.textContent=syncing?`Revisando GitHub… faltan ${st.pending??'?'} repos`:`Revisión pendiente: faltan ${st.pending} repos (pulsa para continuar)`;}
  else if(!l){dot.className='dot';txt.textContent='Aún no se ha revisado GitHub';}
  else{dot.className='dot'+(l.errors.length?' err':'');
    txt.textContent=`Revisado ${fmtWhen(l.finished_at||l.started_at)} · ${l.new_repos.length} repos nuevos · ${l.new_commits.toLocaleString('es-MX')} commits nuevos${l.errors.length?` · ${l.errors.length} con error`:''}`;}
  $('#sync').disabled=$('#syncforce').disabled=syncing;
  if(!$('#syncpanel').hidden)renderSyncPanel();
}
function renderSyncPanel(){
  const st=lastSync,p=$('#syncpanel');if(!st)return;
  const l=st.last;if(!l){p.innerHTML='<p class="note">Pulsa “Buscar repos y commits nuevos” para la primera revisión.</p>';return}
  const first=l.new_repos.length&&l.new_repos.length===l.repos_total;
  p.innerHTML=`<h4>${st.running?'Revisión en curso':'Última revisión'}</h4>
  <dl><dt>${st.running?'Empezó':'Terminó'}</dt><dd>${fmtWhen(st.running?l.started_at:(l.finished_at||l.started_at))}</dd><dt>Repos en GitHub</dt><dd>${l.repos_total??'?'}</dd><dt>Repos revisados</dt><dd>${l.repos_fetched}${l.forced?' (revisión completa)':''}${st.running?` · faltan ${st.pending}`:''}</dd><dt>Commits nuevos</dt><dd>${l.new_commits.toLocaleString('es-MX')}</dd></dl>
  ${l.new_repos.length?`<div><h4>${first?'Repos encontrados (primera revisión)':'Repos nuevos'} · ${l.new_repos.length}</h4><ul>${l.new_repos.map(n=>`<li>${esc(n.split('/')[1])}</li>`).join('')}</ul></div>`:''}
  ${l.errors.length?`<div><h4>Errores</h4><ul class="err">${l.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`:''}`;
}
function toggleSyncPanel(open){const p=$('#syncpanel');open=open??p.hidden;p.hidden=!open;$('#syncmore').setAttribute('aria-expanded',String(open));if(open)renderSyncPanel()}
$('#syncmore').onclick=e=>{e.stopPropagation();toggleSyncPanel()};
async function refreshSync(){try{renderSync(await api('/api/sync'))}catch(e){if(!(e instanceof AuthError))$('#syncst').textContent='No se pudo leer el estado: '+e.message}}
async function startSync(force){
  if(syncing)return;syncing=true;renderSync({...(lastSync||{}),pending:'…'});
  try{
    let st=await api(`/api/sync/start?force=${force}`,{method:'POST'});renderSync({...(lastSync||{}),pending:st.pending});
    do{st=await api('/api/sync/step',{method:'POST'});renderSync(st);detailCache={};await loadMatrix()}while(st.running);
  }catch(e){if(!(e instanceof AuthError)){$('#syncst').textContent='Error: '+e.message;$('#syncdot').className='dot err'}}
  finally{syncing=false;await refreshSync();fillSummaryFilters();if(!$('#v-resumen').hidden)runSummary()}
}
$('#sync').onclick=()=>startSync(false);
$('#syncforce').onclick=()=>startSync(true);

// ---- importar / salir ----
$('#importfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=$('#footmsg');
  try{const data=JSON.parse(await f.text());const r=await api('/api/meta/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    m.textContent=`Importado: ${r.applied} repos${r.pending?` · ${r.pending} pendientes de descubrir`:''}`;m.className='msg ok';await loadMatrix();fillSummaryFilters()}
  catch(err){m.textContent='No se pudo importar: '+err.message;m.className='msg err'}finally{e.target.value=''}};
$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};

// ---- resumen ----
function fillSummaryFilters(){
  const keep=id=>$(id).value;
  const c=keep('#s-client'),t=keep('#s-tag'),r=keep('#s-repo');
  fillSelect($('#s-client'),'Todos',allClients(),c);fillSelect($('#s-tag'),'Todas',allTags(),t);
  const sc=$('#s-client').value,pv=keep('#s-project');const hasC=sc&&sc!=='__none';$('#s-project-l').hidden=!hasC;
  if(hasC)fillSelect($('#s-project'),'Todos',projectsOf(sc),pv);else $('#s-project').innerHTML='<option value=""></option>';
  $('#s-repo').innerHTML=`<option value="">Todos</option>${[...M.repos].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${esc(x.full_name)}">${esc(x.name)}</option>`).join('')}`;$('#s-repo').value=r;
}
function summaryParams(){const p=new URLSearchParams();const v=(k,id)=>{const x=$(id).value;if(x)p.set(k,x)};
  v('month_from','#s-from');v('month_to','#s-to');v('client','#s-client');if(!$('#s-project-l').hidden)v('project','#s-project');v('tag','#s-tag');v('repo','#s-repo');p.set('bots',$('#s-bots').checked);return p}
async function runSummary(){
  const p=summaryParams();$('#s-md').href='/api/summary?'+p+'&format=md';$('#s-csv').href='/api/summary?'+p+'&format=csv';
  const d=await api('/api/summary?'+p);const out=$('#sout');
  if(!d.repos.length){out.innerHTML='<p class="empty">No hay commits con esos filtros.</p>';return}
  let h=`<div class="dhead"><h2>${d.total.toLocaleString('es-MX')} commits en ${d.repos.length} repositorios${d.projects.length?` y ${d.projects.length} proyectos`:''}</h2></div><div class="bymonth">${Object.entries(d.by_month).map(([k,n])=>`<span>${fmtM(k)} · ${n}</span>`).join('')}</div>`;
  if(d.projects.length){
    for(const g of d.projects){
      h+=`<div class="sproj"><h3>${esc(g.project)} <span class="n">${g.total.toLocaleString('es-MX')} commit${g.total===1?'':'s'} · ${g.first===g.last?fmtM(g.first):fmtM(g.first)+' a '+fmtM(g.last)}</span></h3><div class="repos">Repositorios: ${g.repos.map(x=>esc(x.split('/')[1])).join(', ')}</div>`;
      for(const m of g.months){const byR={};for(const c of m.commits)(byR[c.repo]??=[]).push(c);
        h+=`<div class="sline"><div class="lbl"><b>${m.count}</b> commit${m.count===1?'':'s'} en ${esc(m.label)}</div><div class="shas">${Object.entries(byR).map(([rp,cs])=>`<span class="rp">${esc(rp)}:</span> ${cs.map(c=>`<a class="sha" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.date+' '+c.time+' · '+c.message)}">${c.short}</a>`).join(' ')}`).join(' ')}</div></div>`}
      h+='</div>'}
    out.innerHTML=h;return}
  for(const r of d.repos){
    h+=`<div class="srepo"><h3>${esc(r.full_name)} <span class="n">${r.total} commits</span>${r.clients.map(c=>chip(c,projOf(r,c))).join('')}${r.tags.map(t=>`<span class="chip tag">${esc(t)}</span>`).join('')}</h3>`;
    for(const m of r.months)h+=`<div class="sline"><div class="lbl"><b>${m.count}</b> commit${m.count===1?'':'s'} en ${esc(m.label)}</div><div class="shas">${m.commits.map(c=>`<a class="sha" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.date+' '+c.time+' · '+c.message)}">${c.short}</a>`).join('')}</div></div>`;
    h+='</div>'}
  out.innerHTML=h;
}
$('#sform').oninput=e=>{if(e.target.id==='s-client')fillSummaryFilters();runSummary()};
$('#s-copy').onclick=async()=>{const t=await (await fetch('/api/summary?'+summaryParams()+'&format=mdtext')).text();
  try{await navigator.clipboard.writeText(t);$('#s-msg').textContent='Copiado';$('#s-msg').className='msg ok'}catch(e){$('#s-msg').textContent='No se pudo copiar; usa Descargar Markdown';$('#s-msg').className='msg err'}};

// ---- navegación ----
function route(){const v=location.hash==='#resumen'?'resumen':'matriz';$('#v-matriz').hidden=v!=='matriz';$('#v-resumen').hidden=v!=='resumen';
  $('#tab-matriz').classList.toggle('on',v==='matriz');$('#tab-resumen').classList.toggle('on',v==='resumen');if(v==='resumen')runSummary()}
window.addEventListener('hashchange',route);

$('#legend').innerHTML='Menos '+[1,2,3,4,5].map(l=>`<i style="background:var(--h${l})"></i>`).join('')+' Más';
$('#q').oninput=e=>{state.q=e.target.value;renderTable()};
$('#sort').onchange=e=>{state.sort=e.target.value;save();renderTable()};
$('#fclient').onchange=e=>{state.fclient=e.target.value;save();renderTable()};
$('#ftag').onchange=e=>{state.ftag=e.target.value;save();renderTable()};
$('#fproject').onchange=e=>{state.fproject=e.target.value;save();renderTable()};
$('#bots').onchange=async e=>{state.bots=e.target.checked;save();await loadMatrix()};
$('#t').onclick=e=>{const b=e.target.closest('button[data-r]');if(!b)return;const id=+b.dataset.r;if(popRepo===id){closePop();return}openPop(id,b)};

async function boot(){
  $('#login').hidden=true;$('#app').hidden=false;
  const now=new Date();$('#s-to').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;$('#s-from').value=$('#s-to').value;
  await loadMatrix();fillSummaryFilters();route();refreshSync();
}
$('#loginform').onsubmit=async e=>{e.preventDefault();const m=$('#loginmsg');m.textContent='';
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
  if(r.ok){$('#pw').value='';boot().catch(()=>{})}else{let d;try{d=(await r.json()).detail}catch(x){}m.textContent=d||'Contraseña incorrecta'}};
(async()=>{const s=await (await fetch('/api/session')).json();if(s.authenticated)boot().catch(()=>{});else showLogin()})();
</script>
</body>
